apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "credit-scoring-engine.fullname" . }}-default
  labels:
    {{- include "credit-scoring-engine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "credit-scoring-engine.selectorLabels" . | nindent 6 }}
      environment: {{ .Values.app.environment }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          role: ingress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kube-system: "true"
    ports:
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          role: "data"
  - to:
    - namespaceSelector:
        matchLabels:
          role: "metrics"
    ports:
    - protocol: TCP
      port: 9090
